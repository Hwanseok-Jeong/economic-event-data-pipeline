name: Pipeline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'exchange-calendars>=4.5,<5'
      - run: python -m unittest discover -s tests -v
      - run: python pipeline.py demo
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: market_events_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql+pymysql://root:ci-only-password@127.0.0.1:3306/market_events_test
      MYSQL_INTEGRATION_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'SQLAlchemy>=2,<3' 'PyMySQL[rsa]>=1.1,<2'
      - run: python -m unittest discover -s tests -p test_mysql.py -v
