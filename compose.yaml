name: economic-events

x-app: &app
  image: economic-event-pipeline:local
  build: .
  environment:
    MYSQL_HOST: mysql
    MYSQL_DATABASE: ${MYSQL_DATABASE:-market_events_demo}
    MYSQL_USER: ${MYSQL_USER:-pipeline}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-demo-only}
    PIPELINE_DB: mysql
  volumes:
    - reports:/app/outputs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-market_events_demo}
      MYSQL_USER: ${MYSQL_USER:-pipeline}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-demo-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-demo-only}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  pipeline:
    <<: *app
    command: ["python", "container_runner.py", "demo"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
  dashboard:
    <<: *app
    command: ["python", "container_runner.py", "dashboard"]
    depends_on:
      pipeline:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  reports:
